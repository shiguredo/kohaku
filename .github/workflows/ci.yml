name: ci

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  scripts-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false
      - run: |
          uv run --with pytest --with testcontainers pytest -vv scripts/tests

  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false
      - run: |
          uv sync
        working-directory: ingester
      - run: |
          uv run pytest tests/
        working-directory: ingester

  lint:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false
      - run: uv sync
        working-directory: ingester
      - run: uv run ruff check
        working-directory: ingester
      - run: uv run ruff format --check
        working-directory: ingester
      - run: uv run ty check
        working-directory: ingester

  slack_notify:
    needs:
      - scripts-tests
      - ci
      - lint
    runs-on: ubuntu-slim
    if: ${{ always() }}
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Slack Notification
        uses: shiguredo/github-actions/.github/actions/slack-notify@main
        with:
          status: ${{ job.status }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack_channel: kohaku
          notify_mode: failure_and_fixed
        env:
          GH_TOKEN: ${{ github.token }}
