services:
  fluent-bit:
    image: fluent/fluent-bit:5.0.9
    container_name: fluent-bit
    restart: unless-stopped
    volumes:
      - ${SORA_LOG_PATH}:/log
      - ./fluent-bit.yml:/fluent-bit/etc/fluent-bit.yml
      - fluent-bit-state:/var/lib/fluent-bit
    networks:
      - kohaku
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    depends_on:
      mc:
        condition: service_completed_successfully
    command: /fluent-bit/bin/fluent-bit -c /fluent-bit/etc/fluent-bit.yml

  rustfs:
    image: rustfs/rustfs:1.0.0-beta.2
    container_name: rustfs
    restart: unless-stopped
    ports:
      - 9000:9000
      - 9001:9001
    networks:
      - kohaku
    user: ${USER_ID}:${GROUP_ID}
    environment:
      - RUSTFS_ACCESS_KEY=${AWS_ACCESS_KEY_ID}
      - RUSTFS_SECRET_KEY=${AWS_SECRET_ACCESS_KEY}
    volumes:
      - ${RUSTFS_BASE_DIR}/data:/data
      - ${RUSTFS_BASE_DIR}/logs:/logs

  # RustFS の初期設定用コンテナ
  mc:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    container_name: mc
    networks:
      - kohaku
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_BUCKET=${S3_BUCKET}
      - S3_USE_SSL=${S3_USE_SSL:-false}
      - RETENTION_PERIOD=${RETENTION_PERIOD}
    depends_on:
      - rustfs
    volumes:
      - ./scripts/mc-init.sh:/scripts/mc-init.sh:ro
    entrypoint:
      - /bin/sh
      - /scripts/mc-init.sh

  # motherduck-duckdb-datasource は ./plugins に展開済みの想定
  grafana:
    image: grafana/grafana:12.4.3-ubuntu
    container_name: grafana
    restart: unless-stopped
    ports:
      - ${GRAFANA_HTTP_PORT}:3000
    networks:
      - kohaku
    environment:
      - GF_LOG_MODE=console
      - GF_PATHS_DATA=/var/lib/grafana
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=motherduck-duckdb-datasource
      - GF_PATHS_HOME=/usr/share/grafana
      - GF_PATHS_CONFIG=/etc/grafana/grafana.ini
      - GF_PATHS_PLUGINS=/var/lib/grafana/plugins
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_PLUGINS_FORWARD_HOST_ENV_VARS=motherduck-duckdb-datasource
    depends_on:
      - rustfs
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/dashboards/kohaku.yml:/etc/grafana/provisioning/dashboards/kohaku.yml
      - ./grafana/dashboards/kohaku:/var/lib/grafana/dashboards/kohaku
      - ./plugins/motherduck-duckdb-datasource:/var/lib/grafana/plugins/motherduck-duckdb-datasource
      - duckdb:/var/lib/kohaku

  ingester:
    build:
      context: ./ingester
      dockerfile: Dockerfile
    container_name: ingester
    restart: unless-stopped
    # PID 1 に init プロセスを置き、SIGTERM の転送と終了した子プロセスの後始末を行う
    init: true
    # docker stop の SIGTERM から SIGKILL までの猶予を延ばし、update/delete 中の
    # DuckDB 書き込みや後処理に十分な時間を確保する
    stop_grace_period: 60s
    environment:
      - DUCKDB_DB_PATH=${DUCKDB_DB_PATH}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_USE_SSL=${S3_USE_SSL:-false}
      - S3_BUCKET=${S3_BUCKET}
      - S3_PREFIX=${S3_PREFIX}
      - S3_REGION=${S3_REGION:-ap-northeast-1}
      - INITIAL_MAXIMUM_LOAD=${INITIAL_MAXIMUM_LOAD:-}
      - UPDATE_MAXIMUM_LOAD=${UPDATE_MAXIMUM_LOAD:-}
      - UPDATE_INTERVAL=${UPDATE_INTERVAL}
      - RETENTION_PERIOD=${RETENTION_PERIOD}
    depends_on:
      mc:
        condition: service_completed_successfully
    networks:
      - kohaku
    volumes:
      - duckdb:/var/lib/kohaku

volumes:
  duckdb:
    name: kohaku-volume
    driver: local
  fluent-bit-state:
    name: kohaku-fluent-bit-state
    driver: local

networks:
  kohaku:
    name: kohaku-network
    driver: bridge
