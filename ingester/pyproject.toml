[project]
name = "kohaku-ingester"
version = "2025.1.0"
description = "Data ingester for importing WebRTC SFU Sora logs from object storage into DuckDB database"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  # Grafana DuckDB Data Source Plugin の DuckDB のバージョンにあわせる
  "duckdb==1.4.2",
  "minio>=7.2",
  "pytz>=2026.1",
  "pyyaml>=6.0",
  "uuid>=1.30",
]

[dependency-groups]
lint = [
  "ruff",
  "ty",
]
test = [
  "jinja2",
  "pytest",
  "testcontainers[minio]",
]

[tool.ruff.lint]
# ruff のデフォルトの lint ルール (E4/E7/E9, F) に加えて以下を有効化する
# https://docs.astral.sh/ruff/rules/
extend-select = [
  # except 内の raise e を bare raise に置き換えるルール
  # https://docs.astral.sh/ruff/rules/verbose-raise/
  "TRY201",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ty.environment]
extra-paths = ["src"]

[tool.uv]
default-groups = ["test", "lint"]
python-preference = "only-managed"
