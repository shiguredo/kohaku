[project]
name = "kohaku-ingester"
version = "2025.1.0"
description = "Data ingester for importing WebRTC SFU Sora logs from object storage into DuckDB database"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  # Grafana DuckDB Data Source Plugin の DuckDB のバージョンにあわせる
  "duckdb==1.4.2",
  # S3 (MinIO / RustFS 等) へのオブジェクト一覧・取得に使うクライアント
  "minio>=7.2,<7.3",
  # duckdb が TIMESTAMPTZ カラムを Python に変換するときに内部で import するため必須。
  # pytz は年.リリース番号の版体系のため、年単位 (メジャー相当) で境界を切る。
  "pytz>=2026.1,<2027",
  # DUCKDB_COLUMNS のカラム定義 YAML を読み込むために使う
  "pyyaml>=6.0,<6.1",
]

[dependency-groups]
lint = [
  "ruff",
  "ty",
]
test = [
  "jinja2",
  "pytest",
  "testcontainers[minio]",
  # _make_s3_error が urllib3.HTTPResponse() を引数なしで構築するため、
  # 間接依存にせずテスト依存として明示する。3.x で HTTPResponse の API が
  # 変わる可能性があるので上限を切っておく。
  "urllib3>=2.0,<3",
]

[tool.ruff.lint]
# ruff のデフォルトの lint ルール (E4/E7/E9, F) に加えて以下を有効化する
# https://docs.astral.sh/ruff/rules/
extend-select = [
  # 型ヒントの網羅性チェック (flake8-annotations)。
  # mypy の disallow_untyped_defs 相当は ty に存在しないため、 ty の公式 FAQ
  # (https://docs.astral.sh/ty/reference/typing-faq/#why-doesnt-ty-warn-about-missing-type-annotations)
  # の案内に従い Ruff の ANN ルール群で機械検証する
  # https://docs.astral.sh/ruff/rules/#flake8-annotations-ann
  "ANN",
  # except 内の raise e を bare raise に置き換えるルール
  # https://docs.astral.sh/ruff/rules/verbose-raise/
  "TRY201",
  # PEP 8 準拠の import 順序を強制するルール (isort 相当)
  # https://docs.astral.sh/ruff/rules/#isort-i
  "I",
  # pytest スタイルの一貫性チェック (flake8-pytest-style)
  # https://docs.astral.sh/ruff/rules/#flake8-pytest-style-pt
  "PT",
  # Python バージョンに応じた書き方を強制 (pyupgrade)
  # https://docs.astral.sh/ruff/rules/#pyupgrade-up
  "UP",
]

[tool.ruff.lint.per-file-ignores]
# 型ヒントの網羅性チェック (ANN) は Any の整理を伴う別作業の対象ファイルでは
# 型ヒント自体の変更が衝突するため、その作業の完了まで除外する
# (Any 以外の型ヒント付与も含めて扱う)
"tests/test_fluent_bit_rustfs_integration.py" = ["ANN"]
"tests/test_grafana_integration.py" = ["ANN"]
# Any の使用そのもの (ANN401) は Any の整理を伴う別作業の対象のため除外する
# (型ヒントの網羅性チェック (ANN001/ANN201 等) は対象)
"tests/test_ingester.py" = ["ANN401"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ty.environment]
extra-paths = ["src"]

[tool.uv]
default-groups = ["test", "lint"]
python-preference = "only-managed"
